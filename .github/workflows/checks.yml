name: Project checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install test dependencies from Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-flask python3-werkzeug python3-pil ffmpeg
      - name: Validate Python and frontend syntax
        run: |
          /usr/bin/python3 -m compileall -q src deploy scripts legacy
          node --check src/panel/static/app.js
      - name: Test isolated panel, deployment and HLS
        run: /usr/bin/python3 -m unittest discover -s tests -v
      - name: Validate installation plan without installing
        run: /usr/bin/python3 deploy/install.py --config deploy/settings.example.json --check
